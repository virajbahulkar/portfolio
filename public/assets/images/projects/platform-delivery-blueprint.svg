<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Platform Delivery Blueprint</title>
  <desc id="desc">Diagram showing Terraform, AWS, Kubernetes, GitHub Actions, and observability layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="28" fill="url(#bg)"/>
  <text x="40" y="62" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="28" font-weight="700">Platform Delivery Blueprint</text>
  <text x="40" y="94" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Terraform + AWS + Kubernetes + GitHub Actions</text>
  <rect x="40" y="132" width="170" height="58" rx="14" fill="#7c3aed"/>
  <text x="125" y="168" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Terraform</text>
  <rect x="236" y="132" width="170" height="58" rx="14" fill="#ea580c"/>
  <text x="321" y="168" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">AWS</text>
  <rect x="432" y="132" width="168" height="58" rx="14" fill="#2563eb"/>
  <text x="516" y="168" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Kubernetes</text>
  <rect x="138" y="226" width="170" height="58" rx="14" fill="#059669"/>
  <text x="223" y="262" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">GitHub Actions</text>
  <rect x="334" y="226" width="170" height="58" rx="14" fill="#0ea5e9"/>
  <text x="419" y="262" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Monitoring</text>
  <path d="M210 161h26m170 0h26M224 226v-36m196 36v-36" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
