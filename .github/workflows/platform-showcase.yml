name: Platform Showcase Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-showcase.yml'
      - 'platform/aws-platform-showcase/**'
      - 'src/content/project/platform-delivery-blueprint.md'
      - 'src/pages/index.astro'
      - 'src/pages/projects/index.astro'
      - 'src/utils/AppConfig.ts'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/platform-showcase.yml'
      - 'platform/aws-platform-showcase/**'
      - 'src/content/project/platform-delivery-blueprint.md'
      - 'src/pages/index.astro'
      - 'src/pages/projects/index.astro'
      - 'src/utils/AppConfig.ts'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/aws-platform-showcase/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/aws-platform-showcase/app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Run app tests
        run: npm test

      - name: Build application image
        run: docker build -t platform-showcase-api .

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -fsSL https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl -o kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Render Kubernetes manifests
        run: kubectl kustomize platform/aws-platform-showcase/k8s > /tmp/platform-showcase-manifests.yaml

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - platform/aws-platform-showcase/bootstrap
          - platform/aws-platform-showcase/terraform
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [app, kubernetes, terraform]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
      TF_WORKING_DIR: platform/aws-platform-showcase/terraform
      APP_DIR: platform/aws-platform-showcase/app
      K8S_DIR: platform/aws-platform-showcase/k8s
      TFVARS_FILE: environments/${{ inputs.environment }}.tfvars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize remote Terraform state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ inputs.environment }}/platform-showcase.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Apply infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -var-file="${TFVARS_FILE}"

      - name: Capture Terraform outputs
        id: tf
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "platform_api_host=$(terraform output -raw platform_api_host)" >> "$GITHUB_OUTPUT"
          echo "route53_zone_id=$(terraform output -raw route53_zone_id)" >> "$GITHUB_OUTPUT"
          echo "acm_certificate_arn=$(terraform output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${{ steps.tf.outputs.repository_url }}"

      - name: Build and push application image
        working-directory: ${{ env.APP_DIR }}
        env:
          IMAGE_URI: ${{ steps.tf.outputs.repository_url }}:${{ github.sha }}
        run: |
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${{ steps.tf.outputs.cluster_name }}"

      - name: Deploy Kubernetes resources
        env:
          IMAGE_URI: ${{ steps.tf.outputs.repository_url }}:${{ github.sha }}
          ACM_CERTIFICATE_ARN: ${{ steps.tf.outputs.acm_certificate_arn }}
        run: |
          kubectl kustomize "${K8S_DIR}" > /tmp/platform-showcase.yaml
          sed -i "s|ghcr.io/virajbahulkar/platform-showcase-api:latest|${IMAGE_URI}|g" /tmp/platform-showcase.yaml
          sed -i "s|REPLACE_WITH_ACM_CERTIFICATE_ARN|${ACM_CERTIFICATE_ARN}|g" /tmp/platform-showcase.yaml
          kubectl apply -f /tmp/platform-showcase.yaml
          kubectl rollout status deployment/platform-showcase-api -n platform-showcase --timeout=300s

      - name: Wait for load balancer hostname
        id: service
        run: |
          for _ in $(seq 1 30); do
            hostname="$(kubectl get svc platform-showcase-api -n platform-showcase -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            if [ -n "${hostname}" ]; then
              echo "hostname=${hostname}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Load balancer hostname not ready in time" >&2
          exit 1

      - name: Update Route53 DNS
        env:
          PLATFORM_API_HOST: ${{ steps.tf.outputs.platform_api_host }}
          ROUTE53_ZONE_ID: ${{ steps.tf.outputs.route53_zone_id }}
          LOAD_BALANCER_HOSTNAME: ${{ steps.service.outputs.hostname }}
        run: |
          cat <<EOF >/tmp/route53-change.json
          {
            "Comment": "Upsert platform showcase API DNS record",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "${PLATFORM_API_HOST}",
                  "Type": "CNAME",
                  "TTL": 300,
                  "ResourceRecords": [
                    { "Value": "${LOAD_BALANCER_HOSTNAME}" }
                  ]
                }
              }
            ]
          }
          EOF
          aws route53 change-resource-record-sets \
            --hosted-zone-id "${ROUTE53_ZONE_ID}" \
            --change-batch file:///tmp/route53-change.json
